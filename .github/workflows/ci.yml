
name: matrix-build-deploy

on: push

jobs:
  test:
    name: Test
    strategy:
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Build ${{ matrix.platform }}
        run: echo "Testing"

  publish:
    name: Publish
    needs: test
    strategy:
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    environment: production

    steps:
      - name: Publish ${{ matrix.platform }}
        run: echo "Publishing"
