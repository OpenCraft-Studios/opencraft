name: matrix-build-deploy

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build"

  test:
    name: Test
    needs: build
    strategy:
      matrix:
        include:
          - name: Test
            platform: Linux
            runner: ubuntu-latest
          - name: Test
            platform: macOS
            runner: macos-latest
          - name: Test
            platform: Windows
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Build ${{ matrix.platform }}
        run: echo "Testing ${{ matrix.platform }}"

  publish:
    name: Publish
    needs: test
    strategy:
      matrix:
        include:
          - name: Publish
            platform: Linux
            runner: ubuntu-latest
          - name: Publish
            platform: macOS
            runner: macos-latest
          - name: Publish
            platform: Windows
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    environment: production

    steps:
      - name: Publish ${{ matrix.platform }}
        run: echo "Publishing ${{ matrix.platform }}"
