name: matrix-build-deploy

on:
  push:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Building..."

  test:
    name: Test ${{ matrix.platform }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.platform }}
        run: echo "Testing ${{ matrix.platform }}..."

  publish:
    name: Publish ${{ matrix.platform }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    environment: production

    steps:
      - name: Publish ${{ matrix.platform }}
        run: echo "Publishing ${{ matrix.platform }}..."
