
name: matrix-build-deploy

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building..."

  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set-matrix.outputs.platforms }}
    steps:
      - id: set-matrix
        run: |
          echo 'platforms={"include":[{"platform":"Linux","runner":"ubuntu-latest"},{"platform":"macOS","runner":"macos-latest"},{"platform":"Windows","runner":"windows-latest"}]}' >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: [build, define-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Build ${{ matrix.platform }}
        run: echo "Testing ${{ matrix.platform }}"

  publish:
    name: Publish
    needs: [test, define-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    environment: production
    steps:
      - name: Publish ${{ matrix.platform }}
        run: echo "Publishing ${{ matrix.platform }}"
